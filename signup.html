<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account | Organic</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <main class="auth-card">
    <div class="brand">ORGANIC</div>
    <h1>Create your account</h1>
    <p class="subtitle">Sign up to start shopping.</p>

    <!-- shows an error for 4 seconds (set by signUp() in js/signup.js) -->
    <p id="errorMsg" class="msg msg-error" role="alert" style="display: none;"></p>

    <form onsubmit="signUp(); return false;" novalidate>
      <div class="field">
        <label for="firstName">First name</label>
        <input id="firstName" type="text" autocomplete="given-name">
      </div>
      <div class="field">
        <label for="lastName">Last name</label>
        <input id="lastName" type="text" autocomplete="family-name">
      </div>
      <div class="field">
        <label for="emailAddress">Email address</label>
        <input id="emailAddress" type="email" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password">
        <p class="hint">At least 8 characters, with a letter and a number.</p>
      </div>

      <button id="migrate" type="submit" class="btn btn-block">Sign up</button>
    </form>

    <!-- the success message appears here -->
    <div id="display" role="status" aria-live="polite"></div>

    <p class="switch">Already have an account? <a href="signin.html">Sign in</a></p>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
